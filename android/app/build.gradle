apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = true

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

def releaseStoreFilePath = keystoreProperties['storeFile']?.toString()?.trim()
def releaseKeyAlias = keystoreProperties['keyAlias']?.toString()?.trim()
def releaseStorePassword = keystoreProperties['storePassword']?.toString()?.trim()
def releaseKeyPassword = keystoreProperties['keyPassword']?.toString()?.trim()
def releaseStoreFile = releaseStoreFilePath ? rootProject.file(releaseStoreFilePath) : null
def hasReleaseSigning =
    keystorePropertiesFile.exists() &&
    releaseStoreFilePath &&
    releaseKeyAlias &&
    releaseStorePassword &&
    releaseKeyPassword &&
    releaseStoreFile != null &&
    releaseStoreFile.isFile()

def isReleaseAssembleOrBundle = {
    gradle.startParameter.taskNames.any { name ->
        def lower = name.toLowerCase()
        (lower.contains("assemble") || lower.contains("bundle") || lower.contains("install")) &&
            lower.contains("release")
    }
}

if (isReleaseAssembleOrBundle() && !hasReleaseSigning) {
    throw new GradleException(
        "Release signing is fail-closed: missing or incomplete android/keystore.properties " +
            "(storeFile, storePassword, keyAlias, keyPassword) or the keystore file does not exist. " +
            "Copy android/keystore.properties.example → android/keystore.properties and generate a release keystore. " +
            "Debug builds do not require a release keystore."
    )
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.ledgr.app"
    defaultConfig {
        applicationId "com.ledgr.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (hasReleaseSigning) {
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                storeFile releaseStoreFile
                storePassword releaseStorePassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Fail closed: never fall back to debug signing for release.
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            minifyEnabled enableProguardInReleaseBuilds
            shrinkResources enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
